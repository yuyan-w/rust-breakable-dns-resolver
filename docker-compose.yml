services:
  resolver:
    build: ./resolver
    container_name: resolver
    ports:
      - "33053:33053/udp"
    volumes:
      - ./resolver:/app
      - resolver-target:/app/target
    environment:
      AUTH_INTERNAL_ADDR: auth-internal:33053
    restart: unless-stopped
  auth-internal:
    build: ./auth-internal
    container_name: auth-internal
    ports:
      - "33054:33053/udp"
    volumes:
      - ./auth-internal:/app
    environment:
      AUTH_MODE: ${AUTH_MODE:-normal}
    restart: unless-stopped

volumes:
  resolver-target:
