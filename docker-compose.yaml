services:
  resolver:
    build: ./resolver
    container_name: resolver
    ports:
      - "33053:33053/udp"
      - "33053:33053/tcp"
    volumes:
      - ./resolver:/app
      - resolver-target:/app/target
    environment:
      AUTH_INTERNAL_ADDR: 10.0.0.10:33053
      AUTH_DEV_ADDR: 10.0.0.20:33053
    networks:
      dns-lab:
        ipv4_address: 10.0.0.2
    restart: unless-stopped

  auth-internal:
    build: ./auth-internal
    container_name: auth-internal
    ports:
      - "33054:33053/udp"
      - "33054:33053/tcp"
    volumes:
      - ./auth-internal:/app
    environment:
      AUTH_MODE: ${AUTH_MODE:-normal}
    networks:
      dns-lab:
        ipv4_address: 10.0.0.10
    restart: unless-stopped

  auth-dev:
    build: ./auth-dev
    container_name: auth-dev
    ports:
      - "33055:33053/udp"
    volumes:
      - ./auth-dev:/app
    environment:
      AUTH_MODE: ${AUTH_MODE:-normal}
    networks:
      dns-lab:
        ipv4_address: 10.0.0.20
    restart: unless-stopped

  attacker:
    build: ./attacker
    container_name: attacker
    volumes:
      - ./attacker:/app
    depends_on:
      - resolver
    networks:
      dns-lab:
        ipv4_address: 10.0.0.30
    restart: unless-stopped

volumes:
  resolver-target:

networks:
  dns-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
